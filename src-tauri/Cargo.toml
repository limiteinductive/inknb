[package]
name = "inknb-desktop"
version = "0.5.1"
edition = "2021"
default-run = "inknb-desktop"

[[bin]]
name = "inknb-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
inknb-core = { path = "../crates/inknb-core" }
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "=1.2.3"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt-multi-thread", "macros"] }
dirs = "6"
base64 = "0.22"
libc = "0.2"
percent-encoding = "2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-notification = "=2.7.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSNotification", "NSOperation", "NSString", "block2"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSPasteboard", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSWindow", "NSView", "NSButton", "NSControl"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
block2 = "0.6"

objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger"] }
