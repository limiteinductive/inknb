[package]
name = "inknb-core"
version = "0.3.3"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
rusqlite = { version = "=0.32.1", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
